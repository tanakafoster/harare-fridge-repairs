# SEO regression checks, adapted from the SEO research's ci_workflow for this
# static export (Next.js output: "export" into ./out).
name: SEO checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-checks:
    name: Build, site check, JSON-LD and area report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - name: Links, titles, descriptions, canonicals, sitemap
        run: node scripts/check-site.mjs
      - name: JSON-LD validation (errors fail the build)
        run: node tools/jsonld_validate/jsonld_validate.mjs out --quiet --plain
      - name: Suburb page uniqueness report (advisory, never removes pages)
        run: python3 -I tools/location_page_gate/location_page_gate.py --records data/area-evidence.json --html-dir out/areas --only-records --out area-gate.csv | tail -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: area-gate
          path: area-gate.csv
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out
          retention-days: 1

  lighthouse:
    name: Lighthouse CI (SEO audits and LCP/CLS budgets)
    needs: build-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site-out
          path: out
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
